services:
  restore-test-db:
    image: postgres:${POSTGRES_CLIENT_VERSION:-18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: dr_restore
      POSTGRES_PASSWORD: ${RESTORE_TEST_DB_PASSWORD:?Set RESTORE_TEST_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - dr_restore_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr_restore -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: central-sms-dr-manager:local
    build:
      context: .
      args:
        POSTGRES_CLIENT_VERSION: ${POSTGRES_CLIENT_VERSION:-18}
    network_mode: host
    entrypoint: ["/app/dr-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    restart: "no"

  api:
    image: central-sms-dr-manager:local
    build:
      context: .
      args:
        POSTGRES_CLIENT_VERSION: ${POSTGRES_CLIENT_VERSION:-18}
    entrypoint: ["/app/dr-api"]
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: postgres://dr_manager:${DR_METADATA_PASSWORD:?Set DR_METADATA_PASSWORD in .env}@host.docker.internal:55432/dr_manager?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-identity:
    image: central-sms-dr-manager:local
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      WORKER_RESOURCE_KEY: identity-production
      EXPECTED_CONNECTION_REF: secret://identity/production
      TARGET_DATABASE_URL: ${IDENTITY_DATABASE_URL:?Set IDENTITY_DATABASE_URL in .env}
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:?Set RESTORE_TEST_DATABASE_URL in .env}
      BACKUP_ROOT: /backups
      FULL_BACKUP_INTERVAL_SECONDS: ${FULL_BACKUP_INTERVAL_SECONDS:-300}
      DIFFERENTIAL_BACKUP_INTERVAL_SECONDS: ${DIFFERENTIAL_BACKUP_INTERVAL_SECONDS:-120}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      restore-test-db:
        condition: service_healthy
    restart: unless-stopped

  worker-messaging:
    image: central-sms-dr-manager:local
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      WORKER_RESOURCE_KEY: messaging-production
      EXPECTED_CONNECTION_REF: secret://messaging/production
      TARGET_DATABASE_URL: ${MESSAGING_DATABASE_URL:?Set MESSAGING_DATABASE_URL in .env}
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:?Set RESTORE_TEST_DATABASE_URL in .env}
      BACKUP_ROOT: /backups
      FULL_BACKUP_INTERVAL_SECONDS: ${FULL_BACKUP_INTERVAL_SECONDS:-300}
      DIFFERENTIAL_BACKUP_INTERVAL_SECONDS: ${DIFFERENTIAL_BACKUP_INTERVAL_SECONDS:-120}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      restore-test-db:
        condition: service_healthy
    restart: unless-stopped

  worker-billing:
    image: central-sms-dr-manager:local
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      WORKER_RESOURCE_KEY: billing-production
      EXPECTED_CONNECTION_REF: secret://billing/production
      TARGET_DATABASE_URL: ${BILLING_DATABASE_URL:?Set BILLING_DATABASE_URL in .env}
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:?Set RESTORE_TEST_DATABASE_URL in .env}
      BACKUP_ROOT: /backups
      FULL_BACKUP_INTERVAL_SECONDS: ${FULL_BACKUP_INTERVAL_SECONDS:-300}
      DIFFERENTIAL_BACKUP_INTERVAL_SECONDS: ${DIFFERENTIAL_BACKUP_INTERVAL_SECONDS:-120}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      restore-test-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dr_restore_test_data:
